<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Reviews</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="app.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #121212;
    color: #f1f1f1;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    color: #ff6b6b;
    font-weight: 700;
    margin-bottom: 40px;
    letter-spacing: 1px;
  }

  form {
    background-color: #1e1e1e;
    padding: 25px;
    border-radius: 8px;
    max-width: 400px;
    margin: 0 auto 30px auto;
    border: 1px solid #333;
  }

  form input,
  form button,
  form select {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border-radius: 4px;
    border: none;
    background-color: #2c2c2c;
    color: #fff;
    font-size: 15px;
  }

  form input::placeholder {
    color: #aaa;
  }

  form button {
    background-color: #ff6b6b;
    font-weight: bold;
    transition: background-color 0.3s;
  }

  form button:hover {
    background-color: #ff3b3b;
  }

  .sort-controls {
    text-align: center;
    margin: 30px auto;
  }

  .sort-controls select,
  .sort-controls button {
    width: auto;
    margin: 0 10px;
    padding: 10px 15px;
    border-radius: 4px;
    border: none;
    background-color: #2c2c2c;
    color: #fff;
    font-size: 14px;
  }

  .sort-controls button {
    background-color: #28c76f;
    font-weight: bold;
  }

  .sort-controls button:hover {
    background-color: #1f9e54;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background-color: #1e1e1e;
    border: 1px solid #333;
  }

  th, td {
    padding: 15px;
    text-align: left;
    border-bottom: 1px solid #2c2c2c;
  }

  th {
    background-color: #2a2a2a;
    color: #ff6b6b;
    font-weight: 600;
  }

  td button {
    padding: 6px 10px;
    margin-right: 6px;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  td button:first-child {
    background-color: #20c997;
    color: #fff;
  }

  td button:last-child {
    background-color: #e63946;
    color: #fff;
  }

  td button:hover {
    opacity: 0.85;
  }

  @media (max-width: 768px) {
    form, table {
      width: 100%;
    }

    table, th, td {
      font-size: 14px;
    }
  }
</style>

</head>
<body>
  <h1>🎬 Movie Reviews</h1>

  <form id="review-form">
    <input type="text" id="movie" placeholder="Movie Name" required>
    <input type="number" id="rating" placeholder="Rating (0-5)" min="0" max="5" required>
    <input type="text" id="director" placeholder="Director Name" required>
    <input type="date" id="releaseDate" required>
    <button type="submit">Add Review</button>
  </form>

  <div class="sort-controls">
    <label for="sortField">Sort by:</label>
    <select id="sortField">
      <option value="movie">Movie</option>
      <option value="rating">Rating</option>
      <option value="director">Director</option>
      <option value="releaseDate">Release Date</option>
    </select>
    <button onclick="fetchReviews()">Sort</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Movie</th>
        <th>Rating</th>
        <th>Director</th>
        <th>Release Date</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="reviewsTable"></tbody>
  </table>
</body>
</html>
